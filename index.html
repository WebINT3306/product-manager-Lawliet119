<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Sản phẩm</title>
<style>
    /* CSS Styling */
    body {
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        padding: 20px;
        margin: 0;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1, h2 {
        color: #2c3e50;
        margin-top: 0;
    }
    .form-group {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }
    .form-group input {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        flex: 1;
        min-width: 150px;
        font-size: 15px;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        border-color: #3498db;
        outline: none;
    }
    button {
        padding: 12px 25px;
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.2s;
        font-weight: bold;
    }
    button:hover {
        background-color: #2ecc71;
    }
    .error {
        color: #e74c3c;
        font-size: 14px;
        margin-top: -15px;
        margin-bottom: 15px;
        font-weight: 500;
        min-height: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 15px;
    }
    th, td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #ecf0f1;
    }
    th {
        background-color: #34495e;
        color: white;
        font-weight: 600;
    }
    th.sortable {
        cursor: pointer;
        user-select: none;
    }
    th.sortable:hover {
        background-color: #2c3e50;
    }
    /* Alternating row colors and hover effect */
    tbody tr:nth-child(even) {
        background-color: #fcfcfc;
    }
    tbody tr:hover {
        background-color: #f1f4f6;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Quản lý Danh sách Sản phẩm</h1>
    
    <h2>Thêm Sản phẩm Mới</h2>
    <div class="form-group">
        <input type="text" id="input-name" placeholder="Tên sản phẩm">
        <input type="text" id="input-category" placeholder="Danh mục">
        <input type="number" id="input-price" placeholder="Đơn giá" min="1">
        <input type="number" id="input-quantity" placeholder="Số lượng" min="1">
        <button id="btn-add">Thêm</button>
    </div>
    <div id="error-message" class="error"></div>

    <h2>Danh sách Sản phẩm</h2>
    <table id="product-table">
        <thead>
            <tr>
                <th>STT</th>
                <th class="sortable" onclick="sortByName()">Tên sản phẩm <span id="sort-indicator"></span></th>
                <th>Danh mục</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody id="product-tbody">
            <!-- Dữ liệu render từ AJAX -->
        </tbody>
    </table>
</div>

<script>
    let productsList = [];
    let sortState = 0; // 0: clear, 1: asc, 2: desc

    // 4.1 Nạp dữ liệu qua AJAX
    document.addEventListener("DOMContentLoaded", function() {
        loadData();
    });

    function loadData() {
        const xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                productsList = JSON.parse(xhr.responseText);
                renderTable();
            }
        };
        xhr.open('GET', 'products.json', true);
        xhr.send();
    }

    function renderTable() {
        const tbody = document.getElementById("product-tbody");
        tbody.innerHTML = "";
        
        productsList.forEach((product, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${product.name}</td>
                <td>${product.category || '-'}</td>
                <td>${product.price}</td>
                <td>${product.quantity}</td>
            `;
            tbody.appendChild(tr);
        });
        
        updateSortIndicator();
    }
    
    // 4.2 Sắp xếp bảng
    function sortByName() {
        if (sortState === 0 || sortState === 2) {
            // Sắp xếp tăng dần
            productsList.sort((a, b) => a.name.localeCompare(b.name));
            sortState = 1;
        } else {
            // Sắp xếp giảm dần
            productsList.sort((a, b) => b.name.localeCompare(a.name));
            sortState = 2;
        }
        renderTable();
    }

    function updateSortIndicator() {
        const indicator = document.getElementById("sort-indicator");
        if (sortState === 1) {
            indicator.innerText = "▲";
        } else if (sortState === 2) {
            indicator.innerText = "▼";
        } else {
            indicator.innerText = "";
        }
    }

    // 4.3 Thêm sản phẩm
    document.getElementById("btn-add").addEventListener("click", function() {
        const name = document.getElementById("input-name").value.trim();
        const category = document.getElementById("input-category").value.trim();
        const priceStr = document.getElementById("input-price").value;
        const quantityStr = document.getElementById("input-quantity").value;
        const errorDiv = document.getElementById("error-message");
        
        errorDiv.innerText = "";
        
        // Validation
        if (name.length < 3) {
            errorDiv.innerText = "Tên sản phẩm không được rỗng và phải có ít nhất 3 ký tự.";
            return;
        }
        
        const price = Number(priceStr);
        if (!priceStr || isNaN(price) || price <= 0) {
            errorDiv.innerText = "Đơn giá phải là số dương.";
            return;
        }
        
        const quantity = Number(quantityStr);
        if (!quantityStr || !Number.isInteger(quantity) || quantity < 1) {
            errorDiv.innerText = "Số lượng phải là số nguyên lớn hơn hoặc bằng 1.";
            return;
        }
        
        const newProduct = {
            id: productsList.length > 0 ? Math.max(...productsList.map(p => p.id || 0)) + 1 : 1,
            name: name,
            category: category,
            price: price,
            quantity: quantity
        };
        
        productsList.push(newProduct);
        
        // Thêm hàng mới không reload
        const tbody = document.getElementById("product-tbody");
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${productsList.length}</td>
            <td>${newProduct.name}</td>
            <td>${newProduct.category || '-'}</td>
            <td>${newProduct.price}</td>
            <td>${newProduct.quantity}</td>
        `;
        tbody.appendChild(tr);
        
        // Reset inputs
        document.getElementById("input-name").value = "";
        document.getElementById("input-category").value = "";
        document.getElementById("input-price").value = "";
        document.getElementById("input-quantity").value = "";
    });
</script>
</body>
</html>
